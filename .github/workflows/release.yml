name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-24.04
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    if: needs.release.outputs.created == 'true'
    needs:
      - release
      - browser
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            runner: macos-15
            wails_platform: darwin/arm64
          - platform: windows-amd64
            runner: windows-2025
            wails_platform: windows/amd64
          - platform: linux-amd64
            runner: ubuntu-24.04
            wails_platform: linux/amd64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Configure Ubuntu package mirror
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: bash scripts/configure-ubuntu-mirror.sh
      - name: Install Linux build dependencies
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            build-essential file libgtk-3-dev libwebkit2gtk-4.1-dev
      - name: Install frontend dependencies
        shell: bash
        run: |
          npm install --global npm@12.0.2
          npm ci --prefix frontend
      - name: Install Wails
        shell: bash
        run: |
          wails_version="$(go list -m -f '{{.Version}}' github.com/wailsapp/wails/v2)"
          go install "github.com/wailsapp/wails/v2/cmd/wails@${wails_version}"
      - name: Build Client
        shell: bash
        run: |
          tags=()
          if [[ "${{ matrix.platform }}" == "linux-amd64" ]]; then
            tags=(-tags webkit2_41)
          fi
          "$(go env GOPATH)/bin/wails" build \
            -clean -trimpath -m -nosyncgomod \
            -platform "${{ matrix.wails_platform }}" \
            "${tags[@]}" \
            -ldflags "-s -w -X main.desktopVersion=$VERSION"
      - name: Sign, notarize, and package macOS Client
        if: matrix.platform == 'darwin-arm64'
        shell: bash
        env:
          APPLE_DEVELOPER_ID_P12_BASE64: ${{ secrets.APPLE_DEVELOPER_ID_P12_BASE64 }}
          APPLE_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPER_ID_P12_PASSWORD }}
          APPLE_NOTARY_KEY_P8_BASE64: ${{ secrets.APPLE_NOTARY_KEY_P8_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_TIMEOUT: 10m
        run: |
          scripts/sign-notarize-macos-client.sh \
            'build/bin/Cineko.app' \
            "build/release/cineko-client-v${VERSION}-darwin-arm64.zip"
      - name: Package Windows Client
        if: matrix.platform == 'windows-amd64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build/release | Out-Null
          Compress-Archive -LiteralPath build/bin/Cineko.exe `
            -DestinationPath "build/release/cineko-client-v${env:VERSION}-windows-amd64.zip"
      - name: Package Linux Client
        if: matrix.platform == 'linux-amd64'
        shell: bash
        run: |
          mkdir -p build/release
          tar -czf "build/release/cineko-client-v${VERSION}-linux-amd64.tar.gz" \
            -C build/bin Cineko
      - uses: actions/upload-artifact@v7
        with:
          name: client-${{ matrix.platform }}
          path: build/release/cineko-client-v${{ needs.release.outputs.version }}-*
          if-no-files-found: error
          compression-level: 0

  publish:
    if: needs.release.outputs.created == 'true'
    needs:
      - release
      - build
      - browser
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      CINEKO_MINIMUM_LAUNCHER_VERSION: 1.4.0
      CINEKO_BROWSER_REVISION: ${{ needs.browser.outputs.revision }}
      CINEKO_PLAYWRIGHT_VERSION: ${{ needs.browser.outputs.playwright_version }}
      CINEKO_RELEASES_S3_ENDPOINT: ${{ secrets.CINEKO_RELEASES_S3_ENDPOINT }}
      CINEKO_RELEASES_S3_ACCESS_KEY: ${{ secrets.CINEKO_RELEASES_S3_ACCESS_KEY }}
      CINEKO_RELEASES_S3_SECRET_KEY: ${{ secrets.CINEKO_RELEASES_S3_SECRET_KEY }}
      CINEKO_RELEASES_PUBLIC_BASE_URL: https://cdn.dsub.io/cineko/releases
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          pattern: client-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: browser-release-set
          path: release-assets/browser
      - name: Require an unpublished draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh release view '${{ needs.release.outputs.tag }}' \
            --repo '${{ github.repository }}' \
            --json isDraft \
            --jq .isDraft)" = true
      - name: Create checksums
        working-directory: release-assets
        run: sha256sum cineko-client-* > SHA256SUMS
      - name: Download the immutable Playwright runtime
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release-assets/playwright
          gh release download "playwright-v${CINEKO_PLAYWRIGHT_VERSION}" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "cineko-playwright-${CINEKO_PLAYWRIGHT_VERSION}-*" \
            --dir release-assets/playwright
      - name: Publish immutable Client and Playwright artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          client_published_at="$(git show -s --format=%cI HEAD)"
          export CINEKO_CLIENT_RELEASE_BASE="${CINEKO_RELEASES_PUBLIC_BASE_URL}/client/v${VERSION}"
          export CINEKO_RELEASE_METADATA_DIR=release-assets
          export CINEKO_RELEASE_PAYLOAD_OUT=release-assets/client-release-set.json
          scripts/register-client-release.sh "$VERSION" "$client_published_at" release-assets
          scripts/publish-release.sh \
            release-assets/client-release-darwin-arm64.json \
            release-assets/client-release-linux-amd64.json \
            release-assets/client-release-windows-amd64.json

          playwright_published_at="$(gh release view "playwright-v${CINEKO_PLAYWRIGHT_VERSION}" \
            --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
          export CINEKO_PLAYWRIGHT_RELEASE_BASE="${CINEKO_RELEASES_PUBLIC_BASE_URL}/playwright/v${CINEKO_PLAYWRIGHT_VERSION}"
          export CINEKO_RELEASE_METADATA_DIR=release-assets/playwright
          export CINEKO_RELEASE_PAYLOAD_OUT=release-assets/playwright/playwright-release-set.json
          scripts/register-playwright-release.sh \
            "$CINEKO_PLAYWRIGHT_VERSION" "$playwright_published_at" release-assets/playwright
          scripts/publish-release.sh \
            release-assets/playwright/playwright-release-darwin-arm64.json \
            release-assets/playwright/playwright-release-linux-amd64.json \
            release-assets/playwright/playwright-release-windows-amd64.json
      - name: Publish the compatible Client runtime channel
        run: |
          scripts/publish-runtime-channel.sh \
            release-assets/client-release-set.json \
            release-assets/browser/browser-release-set.json \
            release-assets/playwright/playwright-release-set.json
      - name: Attach portable Clients
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload
          "${{ needs.release.outputs.tag }}"
          release-assets/cineko-client-*
          release-assets/SHA256SUMS
          release-assets/client-release-set.json
          --repo "${{ github.repository }}"
      - name: Publish the complete Client release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release edit
          "${{ needs.release.outputs.tag }}"
          --repo "${{ github.repository }}"
          --draft=false
          --latest

  playwright:
    if: needs.release.outputs.created == 'true'
    needs: release
    uses: ./.github/workflows/playwright-release.yml
    with:
      source_ref: ${{ needs.release.outputs.tag }}
    secrets: inherit

  browser:
    if: needs.release.outputs.created == 'true'
    needs:
      - release
      - playwright
    uses: ./.github/workflows/browser-release.yml
    with:
      source_ref: ${{ needs.release.outputs.tag }}
    secrets: inherit
