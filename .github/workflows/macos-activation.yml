name: macOS Activation

on:
  pull_request:
    paths:
      - desktop_activation_*
      - desktop_window.go
      - scripts/test-macos-activation.m
      - .github/workflows/macos-activation.yml

permissions:
  contents: read

jobs:
  activation:
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Compile Client activation lifecycle on macOS
        run: go test -mod=vendor -run 'TestMacOSClientBundleIsLauncherOwnedUIElement' .
      - name: Test native window restoration
        run: |
          clang -fblocks -framework Cocoa scripts/test-macos-activation.m -o "$RUNNER_TEMP/cineko-activation-test"
          "$RUNNER_TEMP/cineko-activation-test"
