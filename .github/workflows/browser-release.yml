name: Browser Runtime Release

on:
  workflow_call:
    inputs:
      source_ref:
        description: Git ref containing the Client runtime targets
        required: true
        type: string
    outputs:
      revision:
        description: Chromium revision from the locked Playwright runtime
        value: ${{ jobs.prepare.outputs.revision }}
      playwright_version:
        description: Locked Playwright driver version
        value: ${{ jobs.prepare.outputs.playwright_version }}
  workflow_dispatch:
    inputs:
      source_ref:
        description: Git ref containing the Client runtime targets
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: browser-runtime-${{ github.repository }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      revision: ${{ steps.browser.outputs.revision }}
      chrome_version: ${{ steps.browser.outputs.chrome_version }}
      playwright_version: ${{ steps.browser.outputs.playwright_version }}
      published_at: ${{ steps.browser.outputs.published_at }}
      source_sha: ${{ steps.browser.outputs.source_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
      - id: browser
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          playwright_version="$(bash scripts/playwright-version.sh driver)"
          playwright_tag="playwright-v${playwright_version}"
          mkdir -p playwright-runtime
          gh release download "$playwright_tag" --repo "$GITHUB_REPOSITORY" \
            --pattern "cineko-playwright-${playwright_version}-linux-amd64.tar.gz" \
            --dir playwright-runtime
          tar -xzf "playwright-runtime/cineko-playwright-${playwright_version}-linux-amd64.tar.gz" \
            -C playwright-runtime
          browsers_json=playwright-runtime/package/browsers.json
          revision="$(scripts/playwright-browser-version.sh "$browsers_json" revision)"
          chrome_version="$(scripts/playwright-browser-version.sh "$browsers_json" version)"
          published_at="$(gh release view "$playwright_tag" --repo "$GITHUB_REPOSITORY" --json publishedAt --jq .publishedAt)"
          {
            printf 'revision=%s\n' "$revision"
            printf 'chrome_version=%s\n' "$chrome_version"
            printf 'playwright_version=%s\n' "$playwright_version"
            printf 'source_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'published_at=%s\n' "$published_at"
          } >> "$GITHUB_OUTPUT"

  generate:
    needs: prepare
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.identity.outputs.tag }}
    env:
      CINEKO_RELEASE_PUBLISHED_AT: ${{ needs.prepare.outputs.published_at }}
      CINEKO_BROWSER_RELEASE_PAYLOAD_OUT: build/release/browser-release-set.json
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Build the official browser release manifest
        run: |
          mkdir -p build/release
          scripts/publish-official-browser-release.sh \
            "${{ needs.prepare.outputs.revision }}" \
            "${{ needs.prepare.outputs.chrome_version }}" \
            "${{ needs.prepare.outputs.playwright_version }}"
      - id: identity
        name: Derive the semantic immutable tag
        run: |
          fingerprint="$(GOWORK=off go run -mod=vendor ./cmd/releasecontract fingerprint browser build/release/browser-release-set.json)"
          printf 'tag=browser-r%s-%s\n' "${{ needs.prepare.outputs.revision }}" "$fingerprint" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: browser-release-set
          path: build/release/browser-release-set.json
          if-no-files-found: error

  publish:
    if: >-
      always() &&
      needs.prepare.result == 'success' &&
      needs.generate.result == 'success'
    needs:
      - prepare
      - generate
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      BROWSER_TAG: ${{ needs.generate.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/download-artifact@v8
        with:
          name: browser-release-set
          path: release-assets
      - name: Publish or verify the immutable browser manifest
        run: |
          if gh release view "$BROWSER_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            mkdir -p existing-release
            gh release download "$BROWSER_TAG" --repo "$GITHUB_REPOSITORY" \
              --pattern browser-release-set.json --dir existing-release
            scripts/verify-browser-release-identity.sh \
              "$BROWSER_TAG" \
              release-assets/browser-release-set.json \
              existing-release/browser-release-set.json
          else
            gh release create "$BROWSER_TAG" release-assets/browser-release-set.json \
              --repo "$GITHUB_REPOSITORY" \
              --target "${{ needs.prepare.outputs.source_sha }}" \
              --title "Browser Runtime r${{ needs.prepare.outputs.revision }}" \
              --notes "Official Chrome for Testing runtime metadata used by Cineko Client." \
              --latest=false
          fi
