name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm install --global npm@12.0.2
      - name: Configure Ubuntu package mirror
        run: bash scripts/configure-ubuntu-mirror.sh
      - run: npm ci
        working-directory: frontend
      - name: Install Playwright runtime dependencies
        run: go run "github.com/mxschmitt/playwright-go/cmd/playwright@$(bash scripts/playwright-version.sh go)" install --with-deps chromium
      - run: make check
